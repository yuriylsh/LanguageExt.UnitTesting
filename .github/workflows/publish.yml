name: Publish to NuGet

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration Release --no-restore

      - name: Pack
        run: >
          dotnet pack LanguageExt.UnitTesting/LanguageExt.UnitTesting.csproj
          --configuration Release
          --no-build
          --output ./artifacts

      - name: Authenticate to NuGet (Trusted Publishing / OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          api-key-source-url: https://api.nuget.org/v3/index.json

      - name: Push
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
